<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi đơn — Bánh Tráng Mì Ruốc Dừa</title>
<meta name="description" content="Xem tình trạng đơn bánh tráng: đang làm, đang giao, phí ship và số tiền cần thanh toán.">
<meta name="theme-color" content="#C62828">
<link rel="icon" href="mon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C62828;--red-d:#A61F1F;--green:#2E7D32;--cream:#FFF6E0;--cream-2:#FBE7B5;--ink:#4A2E1F;--muted:#8A6B55;--line:#EBD6A8;--card:#FFFDF7;--gold:#F2B705}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--cream) radial-gradient(#e9cf95 1px,transparent 1.4px) 0 0/22px 22px;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{height:10px;background:var(--red)}
header{text-align:center;padding:20px 0 6px}
header a{text-decoration:none}
header h1{font-family:"Lobster",cursive;font-weight:400;color:var(--red);font-size:clamp(28px,8vw,40px);margin:0;line-height:1.1}
header p{margin:6px 0 0;font-weight:600;color:var(--muted)}
.en{display:block;font-size:.78em;font-weight:500;color:var(--muted);opacity:.9}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 14px rgba(120,80,20,.08)}
.find{display:flex;gap:8px}
.find input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-transform:uppercase}
.find button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--red-d)}
.mine{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.mine a{font-size:13px;font-weight:700;color:var(--red);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px;text-decoration:none}
.code{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.code b{font-size:18px;letter-spacing:.04em}
.pill{border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;color:#fff;background:var(--green)}
.pill.cancel{background:#9E9E9E}
.big{font-size:20px;font-weight:800;margin:12px 0 2px}
.sub{color:var(--muted);font-weight:500;margin:0}
.steps{list-style:none;margin:16px 0 0;padding:0;position:relative}
.steps li{position:relative;padding:0 0 18px 44px;min-height:34px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:15px;top:30px;bottom:-2px;width:3px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--green)}
.steps .ic{position:absolute;left:0;top:0;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#fff;border:2.5px solid var(--line);filter:grayscale(1);opacity:.6}
.steps li.done .ic{border-color:var(--green);filter:none;opacity:1}
.steps li.now .ic{border-color:var(--red);filter:none;opacity:1;box-shadow:0 0 0 5px rgba(198,40,40,.15);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(198,40,40,.05)}}
.steps b{display:block;padding-top:5px}
.steps li:not(.done):not(.now) b{color:var(--muted);font-weight:600}
.steps small{color:var(--muted)}
.msg{background:#FFF3CD;border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:600;margin-top:14px;white-space:pre-wrap}
.msg::before{content:"💬 Shop nhắn: ";font-weight:800;color:var(--red)}
h3{margin:0 0 10px;font-size:16px}
.items{margin:0;padding:0;list-style:none}
.items li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.items li:last-child{border:0}
.money{margin-top:10px}
.money .r{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.money .r span{color:var(--muted)}
.money .tot{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;font-size:18px;font-weight:800;color:var(--red)}
.money .tot span{color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.bk{text-align:center}
.bk img{width:220px;max-width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.bk .r{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:6px 0;border-bottom:1px dashed var(--line)}
.bk .r span{display:block;font-size:12px;color:var(--muted)}
.bk .cp{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;color:var(--red);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:6px 0}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.contact{display:flex;gap:8px;margin-top:4px}
.contact a{flex:1;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:11px 8px}
.contact .call{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.contact .zalo{background:#0068FF;color:#fff;box-shadow:0 3px 0 #0050c4}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;transition:.25s;z-index:9;opacity:0;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div class="topbar"></div>
<div class="wrap">
  <header><a href="./"><h1>Bánh Tráng Mì Ruốc Dừa</h1></a><p>📍 Theo dõi đơn hàng<span class="en">Order tracking</span></p></header>
  <div class="card" id="findc">
    <div class="find"><input id="q" placeholder="Nhập mã đơn, vd W2210-0930ABC" autocomplete="off" aria-label="Mã đơn"><button id="go" type="button">Xem</button></div>
    <div class="mine" id="mine"></div>
  </div>
  <div id="out"></div>
  <div class="card">
    <h3>Cần hỗ trợ?<span class="en">Need help?</span></h3>
    <div class="contact"><a class="call" href="tel:0919008571">📞 0919 008 571</a><a class="zalo" href="https://zalo.me/0919008571" target="_blank" rel="noopener">💬 Zalo</a></div>
  </div>
  <p class="foot" id="foot"></p>
  <p class="foot"><a href="./" style="color:var(--red);font-weight:700">← Đặt thêm món</a></p>
</div>
<div class="toast" id="toast"></div>
<script>
// Nguồn: tab "Khách xem" (chỉ mã đơn, món, tiền, trạng thái — KHÔNG có tên/SĐT/địa chỉ), publish to web dạng CSV
const PUB_CSV="";
const BANK={bin:"TPB",name:"TPBank",acc:"28428121985",accFmt:"2842 8121 985"};
const $=s=>document.querySelector(s),num=x=>+String(x==null?"":x).replace(/[^\d]/g,"")||0,vnd=n=>num(n).toLocaleString("vi-VN")+"đ";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=new URLSearchParams(location.search),SRC=(/^(localhost|127\.)/.test(location.hostname)&&P.get("src"))||PUB_CSV;
let CODE=(P.get("c")||"").trim().toUpperCase(),timer=null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800)}
function mine(){try{return JSON.parse(localStorage.getItem("btbd_orders")||"[]")}catch(e){return[]}}
function csv(t){const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"){r.push(f);R.push(r);r=[];f=""}else if(c!=="\r")f+=c}
  if(f||r.length){r.push(f);R.push(r)}return R}
async function fetchRows(){const r=await fetch(SRC+(SRC.includes("?")?"&":"?")+"_="+Date.now());const a=csv(await r.text()),h=a.shift()||[];
  return a.map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),x[i]||""])))}
// Trạng thái bếp → bước khách nhìn thấy
function steps(o){const pick=/tự đến lấy/i.test(o.cachtra);
  return [["Mới","🧾","Shop đã nhận đơn"],["Đang làm","🔥","Đang chuẩn bị món"],["Đã xong","📦",pick?"Đã xong — mời bạn đến lấy":"Đã xong — đang đặt tài xế"],
    ["Đã giao","🛵",pick?"Bạn đã nhận món":"Đã giao cho tài xế"],["Đã thu tiền","✅","Hoàn tất — cảm ơn bạn!"]]}
function headline(o,pick){return {"Mới":["Shop đã nhận đơn của bạn","Bếp sẽ bắt đầu làm trước giờ nhận khoảng 1 tiếng."],"Đang làm":["Bếp đang làm món cho bạn 🔥","Món được làm tươi theo đơn."],
  "Đã xong":[pick?"Món đã sẵn sàng — mời bạn ghé lấy":"Món đã xong, shop đang đặt tài xế","Đóng gói riêng từng túi để giữ giòn."],
  "Đã giao":[pick?"Bạn đã nhận món — chúc ngon miệng!":"Món đang trên đường đến bạn 🛵","Nhận món rồi xem hướng dẫn trộn để ăn ngon nhất."],
  "Đã thu tiền":["Đơn đã hoàn tất ✅","Cảm ơn bạn đã ủng hộ shop!"],"Huỷ":["Đơn đã huỷ","Có thắc mắc vui lòng gọi shop."]}[o.trangthai]||[o.trangthai,""]}
function money(o){const goods=num(o.tienhang),shipN=/\d/.test(o.ship)?num(o.ship):null,cach=o.cachtra||"",pick=/tự đến lấy/i.test(cach);
  let shipTxt,payShop=goods,driver=0,hint="";
  if(pick){shipTxt="Tự đến lấy"}
  else if(/^free/i.test(cach)){shipTxt="Miễn phí"}
  else if(/nhóm/i.test(cach)){shipTxt="Người tạo nhóm trả"}
  else if(shipN==null){shipTxt="Shop sẽ báo khi đặt tài xế";hint="Phí ship được cập nhật ở đây ngay khi shop đặt xe."}
  else if(/^cộng/i.test(cach)){shipTxt=vnd(shipN);payShop=goods+shipN}
  else{shipTxt=vnd(shipN)+" · trả tài xế";driver=shipN}
  return {goods,shipTxt,payShop,driver,hint,shipKnown:shipN!=null||pick||/^free|nhóm/i.test(cach)}}
function bankBox(amount,code){const url=`https://img.vietqr.io/image/${BANK.bin}-${BANK.acc}-compact.png?amount=${amount}&addInfo=${encodeURIComponent(code)}`;
  const row=(l,v,c)=>`<div class="r"><div><span>${l}</span><b>${v}</b></div>${c!=null?`<button type="button" class="cp" data-c="${c}">Sao chép</button>`:""}</div>`;
  return `<div class="card bk"><h3>Quét mã để chuyển khoản<span class="en">Scan to pay</span></h3><img src="${url}" alt="Mã QR chuyển khoản">
    ${row("Ngân hàng",BANK.name)}${row("Số tài khoản",BANK.accFmt,BANK.acc)}${row("Số tiền",vnd(amount),amount)}${row("Nội dung",code,code)}</div>`}
function render(o){
  const pick=/tự đến lấy/i.test(o.cachtra),S=steps(o),H={};(o.lichsu||"").split("|").filter(Boolean).forEach(x=>{const[t,s]=x.split("~");H[s]=t});
  const cur=S.findIndex(s=>s[0]===o.trangthai),cancel=o.trangthai==="Huỷ",[h1,h2]=headline(o,pick),M=money(o);
  const stepHtml=cancel?"":`<ol class="steps">${S.map((s,i)=>`<li class="${i<cur||(i===cur&&i===S.length-1)?"done":i===cur?"now":""}"><span class="ic">${s[1]}</span><b>${s[2]}</b>${H[s[0]]?`<small>${esc(H[s[0]])}</small>`:""}</li>`).join("")}</ol>`;
  const items=o.mon.split("\n").filter(Boolean).map(l=>`<li>${esc(l.replace(/\s*\([\d.]+đ\)\s*=\s*/," = "))}</li>`).join("");
  const unpaid=o.trangthai!=="Đã thu tiền"&&!cancel&&/chuyển khoản/i.test(o.thanhtoan);
  $("#out").innerHTML=`<div class="card"><div class="code"><b>${esc(o.ma)}</b><span class="pill${cancel?" cancel":""}">${esc(o.trangthai)}</span></div>
    <p class="big">${h1}</p><p class="sub">${h2}</p>${o.nhankhach?`<div class="msg">${esc(o.nhankhach)}</div>`:""}${stepHtml}
    <p class="hint">⏰ ${pick?"Hẹn lấy":"Giờ nhận"}: <b>${esc(o.nhan)}</b>${o.capnhat?` · cập nhật ${esc(o.capnhat)}`:""}</p></div>
  <div class="card"><h3>🧾 Món đã đặt · ${esc(o.phan)}</h3><ul class="items">${items}</ul>
    <div class="money"><div class="r"><span>Tiền hàng</span><b>${vnd(M.goods)}</b></div><div class="r"><span>Phí ship</span><b>${M.shipTxt}</b></div>
    <div class="r tot"><span>${M.shipKnown?"Thanh toán cho shop":"Tạm tính (chưa gồm ship)"}</span><b>${vnd(M.payShop)}</b></div>
    ${M.driver?`<div class="r"><span>Trả tài xế khi nhận</span><b>${vnd(M.driver)}</b></div>`:""}
    <div class="r"><span>Hình thức</span><b>${esc(o.thanhtoan)}</b></div></div>${M.hint?`<p class="hint">${M.hint}</p>`:""}</div>
  ${unpaid&&M.shipKnown?bankBox(M.payShop,o.ma):""}`;
  document.title=`${o.trangthai} · ${o.ma} — Theo dõi đơn`}
function pending(l){$("#out").innerHTML=`<div class="card"><div class="code"><b>${esc(l.code)}</b><span class="pill">Mới</span></div><p class="big">Shop đã nhận đơn của bạn</p>
  <p class="sub">Trạng thái sẽ hiện ở đây sau 1–5 phút. Trang tự làm mới.</p><p class="hint">⏰ Giờ nhận: <b>${esc(l.when||"")}</b></p></div>`}
async function load(){
  if(!CODE){$("#out").innerHTML="";return}
  $("#q").value=CODE;
  if(!SRC){$("#out").innerHTML=`<div class="card empty">Trang theo dõi đang được cài đặt — vui lòng gọi shop 0919 008 571.</div>`;return}
  try{const rows=await fetchRows(),o=rows.find(r=>(r.ma||"").toUpperCase()===CODE);
    if(o)render(o);else{const l=mine().find(x=>x.code===CODE);
      if(l&&Date.now()-l.ts<36e5*2)pending(l);else $("#out").innerHTML=`<div class="card empty">Không tìm thấy đơn <b>${esc(CODE)}</b>.<br>Kiểm tra lại mã đơn (trong tin xác nhận), hoặc đơn đã quá 3 ngày.</div>`}
    $("#foot").textContent="Tự làm mới mỗi phút · lần cuối "+new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  }catch(e){$("#foot").textContent="Mạng yếu — đang thử lại…"}
  clearTimeout(timer);timer=setTimeout(load,60000)}
function go(){const v=$("#q").value.trim().toUpperCase();if(!v)return;CODE=v;history.replaceState(null,"","?c="+encodeURIComponent(v));load()}
$("#go").onclick=go;$("#q").onkeydown=e=>{if(e.key==="Enter")go()};
document.addEventListener("click",e=>{const b=e.target.closest(".cp");if(!b)return;navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c).then(()=>toast("Đã sao chép"),()=>{})});
const M=mine().slice(-5).reverse();if(M.length)$("#mine").innerHTML="Đơn của bạn: "+M.map(x=>`<a href="?c=${encodeURIComponent(x.code)}">${esc(x.code)}</a>`).join("");
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&CODE)load()});
load();
</script>
</body>
</html>
